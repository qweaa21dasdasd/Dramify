spring:
  application:
    name: Dramify API
  datasource:
    url: jdbc:mysql://localhost:3306/drama_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 5678

logging:
  level:
    com.dramagenerator.backend: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

app:
  storage:
    local-path: ./data/storage
    base-url: http://localhost:5678/static
